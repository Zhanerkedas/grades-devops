groups:
  - name: grades
    rules:
      - alert: GradesAppDown
        expr: up{job="grades-app"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Приложение успеваемости недоступно"
      - alert: GradesDatabaseDown
        expr: grades_db_up == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Приложение потеряло соединение с PostgreSQL"
      - alert: GradesHighErrorRate
        expr: increase(grades_http_errors_total[5m]) > 5
        labels: {severity: warning}
        annotations:
          summary: "Более 5 ошибок 5xx за 5 минут"
